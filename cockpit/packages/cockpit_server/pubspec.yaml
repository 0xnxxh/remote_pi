name: cockpit_server
description: O cockpit-server (plano 58) — binário Dart headless que serve o motor do Cockpit via protocolo JSONL sobre socket local.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  auto_injector: ^2.0.0
  cockpit_core:
    path: ../cockpit_core
  cockpit_engine:
    path: ../cockpit_engine
  cockpit_protocol:
    path: ../cockpit_protocol

dev_dependencies:
  test: ^1.25.0

executables:
  cockpit_server: cockpit_server
