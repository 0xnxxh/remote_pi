<!doctype html>
<!-- Esqueleto do preview de markdown (plano 58). O Dart monta a página final
     substituindo os placeholders: __NONCE__ (CSP dos scripts inline),
     __CSS__ e os três __JS_*__ (assets vendorizados, inlined — a CSP não
     permite request nenhum além de ckp-res:/data: pra imagem). -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src ckp-res: data:; style-src 'unsafe-inline'; script-src 'nonce-__NONCE__'"
    />
    <style>
      __CSS__
    </style>
  </head>
  <body>
    <div id="content"></div>
    <script nonce="__NONCE__">
      __JS_MARKDOWN_IT__;
    </script>
    <script nonce="__NONCE__">
      __JS_PURIFY__;
    </script>
    <script nonce="__NONCE__">
      __JS_MORPHDOM__;
    </script>
    <script nonce="__NONCE__">
      __JS_PREVIEW__;
    </script>
  </body>
</html>
